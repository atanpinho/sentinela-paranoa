<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRANQUE - Sentinela Paranoá</title>
    
    <!-- Folha de estilos do Leaflet para renderizar as camadas -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .header-app {
            background-color: #0b3c5d;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-align: center;
            position: relative;
            z-index: 1000;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.5);
        }
        #map {
            width: 100%;
            height: calc(100vh - 65px);
            background-color: #1a1a1a;
        }
        /* Botão do GPS flutuando sobre a cartografia */
        .btn-gps {
            position: absolute;
            top: 85px;
            right: 20px;
            z-index: 1000;
            background-color: #0c5a8f;
            color: white;
            border: 2px solid white;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .btn-gps:hover {
            background-color: #1374b5;
        }
    </style>
</head>
<body>

    <div class="header-app">
        ARRANQUE: Sentinela Paranoá
        <div style="font-size: 12px; font-weight: normal; margin-top: 4px;">Monitoramento Ecológico Dinâmico</div>
    </div>

    <!-- Elemento do Botão Interativo do GPS -->
    <button class="btn-gps" id="btnGps">🎯 Ativar Meu GPS</button>

    <!-- Contêiner do Mapa -->
    <div id="map"></div>

    <!-- Biblioteca JavaScript do Leaflet -->
    <script src="https://unpkg.com"></script>
    <script>
        // 1. Inicializa a mesa virtual do mapa em formato plano cartesiano simples
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        // 2. Define o tamanho da grade virtual (proporção 1000x1000 baseada na sua bancada)
        const limitesDoMapa = [[0, 0], [1000, 1000]];

        // 3. Carrega o arquivo físico real que você exportou do Illustrator para a pasta static
        const overlayMapa = L.imageOverlay('/static/mapa-1.png', limitesDoMapa).addTo(map);
        map.fitBounds(limitesDoMapa);

        // =======================================================================
        // MATRIZ DE CALIBRAÇÃO GEOGRÁFICA DO DISTRITO FEDERAL
        // =======================================================================
        // Ajusta as bordas invisíveis de latitude e longitude reais que o mapa cobre
        const CORRECAO_GEO = {
            topLat: -15.6500,      // Limite do topo da folha (Pixel Y = 1000)
            bottomLat: -15.8500,   // Limite da base da folha (Pixel Y = 0)
            leftLng: -48.0000,     // Limite esquerdo da folha (Pixel X = 0)
            rightLng: -47.6500     // Limite direito da folha (Pixel X = 1000)
        };

        function converterCoordenadasParaPixels(lat, lng) {
            // Regra de três proporcional para descobrir o ponto Y na imagem
            let deltaLat = CORRECAO_GEO.topLat - CORRECAO_GEO.bottomLat;
            let pixelY = ((lat - CORRECAO_GEO.bottomLat) / deltaLat) * 1000;

            // Regra de três proporcional para descobrir o ponto X na imagem
            let deltaLng = CORRECAO_GEO.rightLng - CORRECAO_GEO.leftLng;
            let pixelX = ((lng - CORRECAO_GEO.leftLng) / deltaLng) * 1000;

            return [pixelY, pixelX];
        }

        // =======================================================================
        // RECEBIMENTO E DESIGN DOS ALFINETES DO BANCO DE DADOS (Jinja2)
        // =======================================================================
        const alertasDoBanco = {{ alerts | tojson if alerts is defined else "[]" }};

        // Fallback visual de segurança para caso a tabela de ocorrências esteja limpa
        const dadosParaExibir = alertasDoBanco.length > 0 ? alertasDoBanco : [
            {"categoria": "Esgoto Clandestino", "descricao": "Ponto de vazamento na bacia.", "posicao_top": 500, "posicao_left": 500},
            {"categoria": "Descarte de Lixo", "descricao": "Acúmulo de lixo nas margens detectado.", "posicao_top": 620, "posicao_left": 420}
        ];

        // Roda o laço e plota os marcadores vermelhos baseados nos eixos salvos no banco
        dadosParaExibir.forEach(alerta => {
            L.marker([alerta.posicao_top, alerta.posicao_left]).addTo(map)
                .bindPopup(`<b>${alerta.categoria}</b><br>${alerta.descricao || 'Alerta comunitário active.'}`);
        });

        // =======================================================================
        // EVENTO E ACIONAMENTO DO SENSOR DE GPS DO AGENTE COMUNITÁRIO
        // =======================================================================
        const botaoGps = document.getElementById('btnGps');
        let pontoAzulAgente = null;

        botaoGps.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Seu navegador não possui suporte para leitura de GPS.');
                return;
            }

            botaoGps.innerText = "⏳ Buscando Satélites...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latReal = position.coords.latitude;
                    const lngReal = position.coords.longitude;

                    // Converte a localização em graus do satélite para a escala 1000x1000 da imagem
                    const [pontoY, pontoX] = converterCoordenadasParaPixels(latReal, lngReal);

                    // Verifica se as coordenadas batem dentro do quadrado do mapa do DF
                    if (pontoY >= 0 && pontoY <= 1000 && pontoX >= 0 && pontoX <= 1000) {
                        
                        if (pontoAzulAgente) {
                            map.removeLayer(pontoAzulAgente);
                        }

                        // Desenha o círculo azul identificador de posição do Agente na prancheta
                        pontoAzulAgente = L.circleMarker([pontoY, pontoX], {
                            radius: 10,
                            fillColor: "#007bff",
                            color: "#ffffff",
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 0.8        
                        }).addTo(map).bindPopup("<b>Você está aqui</b><br>Posição sincronizada no mapa.").openPopup();

                        map.setView([pontoY, pontoX], 1);
                        botaoGps.innerText = "🎯 GPS Ativo";
                    } else {
                        alert(`GPS Ativo, mas sua posição atual está fora da bacia configurada.\nPixels calculados: X: ${pontoX.toFixed(0)}, Y: ${pontoY.toFixed(0)}`);
                        botaoGps.innerText = "🎯 Ativar Meu GPS";
                    }
                },
                (error) => {
                    console.error(error);
                    alert('Não foi possível acessar seus dados de localização. Certifique-se de que a localização está ligada.');
                    botaoGps.innerText = "🎯 Ativar Meu GPS";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    </script>
</body>
</html>
